<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OTIUM CODE - Mobile & Desktop Shadow Illusion</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #7d7d7d;
      cursor: crosshair;
      touch-action: none; /* Prevents scroll bounce and pull-to-refresh */
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <!-- Three.js + FontLoader + TextGeometry from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>

  <script>
    const BG_HEX = 0x7d7d7d;

    // 1. Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(BG_HEX);

    // 2. Responsive Camera Setup
    function getViewSize() {
      const isPortrait = window.innerHeight > window.innerWidth;
      // Expand vertical bounds in portrait so the horizontal text fits comfortably
      return isPortrait ? 1350 : 900;
    }

    let viewSize = getViewSize();
    let aspect = window.innerWidth / window.innerHeight;

    const camera = new THREE.OrthographicCamera(
      (-aspect * viewSize) / 2,
      (aspect * viewSize) / 2,
      viewSize / 2,
      -viewSize / 2,
      1,
      2000
    );
    camera.position.set(0, 0, 1000);
    camera.lookAt(0, 0, 0);

    // 3. Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap at 2x for mobile GPU efficiency
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // 4. Directional Light (Shadow Caster)
    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(0, 0, 450);
    light.castShadow = true;
    light.shadow.mapSize.width = 2048;
    light.shadow.mapSize.height = 2048;
    light.shadow.camera.near = 50;
    light.shadow.camera.far = 1000;

    const shadowBounds = 1400;
    light.shadow.camera.left = -shadowBounds;
    light.shadow.camera.right = shadowBounds;
    light.shadow.camera.top = shadowBounds;
    light.shadow.camera.bottom = -shadowBounds;
    light.shadow.bias = -0.0005;
    scene.add(light);

    // 5. Materials
    const flatGreyMat = new THREE.MeshBasicMaterial({ color: BG_HEX });
    const greenTintMat = new THREE.MeshBasicMaterial({ color: 0x708a74 }); // Subtly sage-tinted grey
    const shadowCatcherMat = new THREE.ShadowMaterial({ opacity: 0.38 });

    // 6. Background Plane + Shadow Receiver
    const planeGeo = new THREE.PlaneGeometry(viewSize * 6, viewSize * 6);
    const bgMesh = new THREE.Mesh(planeGeo, flatGreyMat);
    scene.add(bgMesh);

    const shadowPlane = new THREE.Mesh(planeGeo, shadowCatcherMat);
    shadowPlane.position.set(0, 0, 0.5); // Micro-offset to eliminate z-fighting
    shadowPlane.receiveShadow = true;
    scene.add(shadowPlane);

    // 7. Load Font and Build Typography
    const fontLoader = new THREE.FontLoader();
    fontLoader.load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', (font) => {
      function createCenteredText(text, size, height, letterSpacing, material) {
        const textGeo = new THREE.TextGeometry(text, {
          font: font,
          size: size,
          height: height,
          curveSegments: 8,
          bevelEnabled: false,
          letterSpacing: letterSpacing
        });

        textGeo.computeBoundingBox();
        const cx = (textGeo.boundingBox.max.x + textGeo.boundingBox.min.x) / 2;
        const cy = (textGeo.boundingBox.max.y + textGeo.boundingBox.min.y) / 2;
        textGeo.translate(-cx, -cy, 0);

        const mesh = new THREE.Mesh(textGeo, material);
        mesh.castShadow = true;
        mesh.receiveShadow = false;
        return mesh;
      }

      // "OTIUM"
      const otiumMesh = createCenteredText('OTIUM', 110, 50, 0, flatGreyMat);
      otiumMesh.position.set(0, 25, 0);
      scene.add(otiumMesh);

      // "CODE"
      const codeMesh = createCenteredText('CODE', 34, 30, 4.5, greenTintMat);
      codeMesh.position.set(0, -75, 0);
      scene.add(codeMesh);
    });

    // 8. Pointer & Gyroscope Motion Logic
    const MAX_RADIUS = 320;
    const targetPos = new THREE.Vector2(0, 0);
    let hasGyroscopeData = false;

    // Pointer Handler (Mouse + Touch Drag)
    function handlePointer(clientX, clientY) {
      const rawX = ((clientX / window.innerWidth) * 2 - 1) * ((aspect * viewSize) / 2);
      const rawY = (-(clientY / window.innerHeight) * 2 + 1) * (viewSize / 2);

      const dist = Math.hypot(rawX, rawY);
      if (dist > 0) {
        const compressedDist = MAX_RADIUS * (dist / (dist + MAX_RADIUS * 0.7));
        const scale = compressedDist / dist;
        targetPos.x = rawX * scale;
        targetPos.y = rawY * scale;
      } else {
        targetPos.set(0, 0);
      }
    }

    // Mouse movement
    window.addEventListener('mousemove', (e) => handlePointer(e.clientX, e.clientY));

    // Touch movement
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        handlePointer(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    // Gyroscope / Tilt Handler
    function handleOrientation(e) {
      if (e.gamma === null && e.beta === null) return;
      hasGyroscopeData = true;

      // gamma: Left-to-right tilt [-90 to 90]
      // beta: Front-to-back tilt [-180 to 180]. Subtract ~45° for typical viewing angle
      const tiltX = e.gamma || 0;
      const tiltY = (e.beta || 45) - 45;

      const normX = Math.max(-1, Math.min(1, tiltX / 30));
      const normY = Math.max(-1, Math.min(1, tiltY / 30));

      targetPos.x = normX * MAX_RADIUS * 0.85;
      targetPos.y = -normY * MAX_RADIUS * 0.85;
    }

    // iOS 13+ Permission activation on first screen interaction
    function initGyroscope() {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then((state) => {
            if (state === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
            }
          })
          .catch(console.error);
      } else if (typeof window.DeviceOrientationEvent !== 'undefined') {
        window.addEventListener('deviceorientation', handleOrientation);
      }
    }

    window.addEventListener('click', initGyroscope, { once: true });
    window.addEventListener('touchstart', initGyroscope, { once: true });

    // 9. Animation Loop
    function animate() {
      requestAnimationFrame(animate);

      // Smooth lag / damping toward pointer or tilt target
      light.position.x += (targetPos.x - light.position.x) * 0.12;
      light.position.y += (targetPos.y - light.position.y) * 0.12;

      light.target.position.set(0, 0, 0);
      light.target.updateMatrixWorld();

      renderer.render(scene, camera);
    }
    animate();

    // 10. Viewport Resize & Orientation Change
    window.addEventListener('resize', () => {
      viewSize = getViewSize();
      aspect = window.innerWidth / window.innerHeight;

      camera.left = (-aspect * viewSize) / 2;
      camera.right = (aspect * viewSize) / 2;
      camera.top = viewSize / 2;
      camera.bottom = -viewSize / 2;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
